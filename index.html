<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="VOLT-X EV Charging Staff Scanner – scan customer QR passes and activate charging sessions." />
  <title>VOLT‑X Staff Scanner</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header class="header-bar">
      <div class="header-title">
        <span class="logo-icon">⚡</span>
        <h1>VOLT‑X Staff Scanner</h1>
      </div>
      <div class="header-actions">
        <button id="test-qr-btn" class="icon-btn" title="Live Test QR Pass">🧪</button>
        <button id="camera-flip-btn" class="icon-btn" title="Switch Camera">🔄</button>
      </div>
    </header>

    <!-- QR Scanner Live View -->
    <div id="qr-reader"></div>

    <!-- Scan overlay frame -->
    <div class="scan-overlay" id="scan-overlay" style="display: none;">
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
      <div class="scan-line"></div>
    </div>
    
    <!-- Controls bottom bar -->
    <div class="bottom-controls" id="bottom-controls">
      <button id="scan-toggle-btn" class="btn btn-primary" style="max-width: 280px; width: 100%;">
        📷 Start Scanner
      </button>
      <button id="quick-test-btn" class="btn btn-secondary" style="max-width: 280px; width: 100%; margin-top: 4px;">
        🧪 Live Test Pass
      </button>
      <input type="file" id="camera-capture-fallback" accept="image/*" capture="environment" style="display: none;" />
      <p class="scan-hint" id="scan-hint" style="display: none;">Align QR pass inside the frame</p>
    </div>

    <!-- Verification Card -->
    <div id="verification-card" class="card hidden">
      <div class="status-badge valid">
        <span class="status-dot"></span>
        VALID BOOKING
      </div>
      <div class="detail-row">
        <span class="detail-label">Station ID</span>
        <span class="detail-value" id="station-id">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Customer</span>
        <span class="detail-value" id="customer-email">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Booking ID</span>
        <span class="detail-value" id="booking-id">—</span>
      </div>
      <button id="approve-btn" class="btn btn-primary">
        ⚡ Approve &amp; Start Charging
      </button>
      <button id="cancel-verify-btn" class="btn btn-secondary" style="margin-top: 10px;">
        ✕ Cancel
      </button>
    </div>

    <!-- Success Card -->
    <div id="success-card" class="card hidden">
      <div class="success-icon">✓</div>
      <div class="status-badge success">
        <span class="status-dot"></span>
        CHARGING ACTIVE
      </div>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 8px;">
        Session has been activated successfully.
      </p>
      <button id="next-scan-btn" class="btn btn-secondary">
        Scan Next Pass →
      </button>
    </div>

    <!-- Error Card -->
    <div id="error-card" class="card hidden">
      <div class="status-badge error">
        <span class="status-dot"></span>
        <span id="error-title">INVALID</span>
      </div>
      <p class="error-msg" id="error-msg">—</p>
      <button id="error-retry-btn" class="btn btn-secondary">
        Try Again →
      </button>
    </div>

    <!-- Live Test QR Modal -->
    <div id="test-modal" class="card hidden">
      <div class="status-badge valid">
        <span class="status-dot"></span>
        LIVE TEST PASS
      </div>
      <p style="color: var(--text-secondary); font-size: 0.85rem; margin: 12px 0; text-align: center;">
        Point another device camera at this code, or click <b>Simulate Scan</b> to test the full flow.
      </p>
      <div style="display: flex; justify-content: center; margin-bottom: 14px;">
        <img id="test-qr-image" alt="Sample EV Pass QR Code" style="width: 170px; height: 170px; border-radius: 12px; border: 2px solid var(--accent-cyan); background: #ffffff; padding: 6px;" />
      </div>
      <button id="simulate-scan-btn" class="btn btn-primary">
        ⚡ Simulate Live Scan
      </button>
      <button id="close-test-btn" class="btn btn-secondary" style="margin-top: 10px;">
        ✕ Close
      </button>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast info"></div>
  </div>

  <!-- Load html5-qrcode -->
  <script src="html5-qrcode.min.js"></script>
  <script>
    if (typeof Html5Qrcode === "undefined") {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.7/html5-qrcode.min.js"><\/script>');
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
